<!DOCTYPE html>
<html>

<head>
    <title>Learnify - Goal Tracker</title>
    <link rel="stylesheet" href="style/goals-style.css">
</head>

<body>

    <nav>
        <h2>Learnify</h2>

        <div>
            <a href="index.html">Dashboard</a>
            <a href="notebook.html">Notebook</a>
            <a href="quiz.html">Quiz</a>
            <a href="flashcards.html">Flashcards</a>
            <a href="goals.html" style="text-decoration: underline;">Goal Tracker</a>
        </div>
    </nav>

    <main>

        <div class="box">
            <h1>Goal Tracker</h1>
            <p>Set daily or weekly academic goals and track your completion progress.</p>

            <form id="goalForm" onsubmit="event.preventDefault(); addGoal();">
                <label>Goal Title</label>
                <input type="text" id="title" placeholder="e.g. Study Operating Systems" required>

                <label>Goal Type</label>
                <select id="type">
                    <option value="Daily">Daily</option>
                    <option value="Weekly">Weekly</option>
                </select>

                <label>Target Completion Date</label>
                <input type="date" id="targetDate" required>

                <label>Target Hours</label>
                <input type="number" id="targetHours" min="1" step="0.5" placeholder="e.g. 10" required>

                <label>Completed Hours</label>
                <input type="number" id="completedHours" min="0" step="0.5" value="0" required>

                <button type="submit">Add Goal</button>
            </form>
        </div>

        <div class="box">
            <h2>Your Goals</h2>

            <table>

                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Target Date</th>
                        <th>Study Hours</th>
                        <th>Progress</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="goalTable">
                </tbody>

            </table>
        </div>

    </main>

    <script>

        function addGoal() {

            var title =
                document.getElementById("title").value;

            var type =
                document.getElementById("type").value;

            var targetDate =
                document.getElementById("targetDate").value;

            var targetHours =
                parseFloat(
                    document.getElementById("targetHours").value
                );

            var completedHours =
                parseFloat(
                    document.getElementById("completedHours").value
                ) || 0;


            fetch("/api/goals", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    title: title,

                    type: type,

                    targetDate: targetDate,

                    targetHours: String(targetHours),

                    completedHours: String(completedHours)

                })

            })

                .then(response => response.text())

                .then(result => {

                    if (result === "Goal added successfully!") {

                        document
                            .getElementById("goalForm")
                            .reset();

                        loadGoals();

                    } else {

                        alert(result);
                    }

                })

                .catch(error => {

                    console.log(error);

                    alert("Something went wrong.");

                });
        }



        function loadGoals() {

            fetch("/api/goals/list")

                .then(response => response.text())

                .then(data => {

                    var table =
                        document.getElementById("goalTable");


                    table.innerHTML = "";


                    if (data.trim() === "") {

                        table.innerHTML =
                            "<tr><td colspan='7'>No goals yet.</td></tr>";

                        return;
                    }


                    var goals =
                        data.trim().split("\n");


                    goals.forEach(function (goal) {

                        var parts =
                            goal.split("|");


                        var goalID =
                            parts[0];

                        var title =
                            parts[1];

                        var type =
                            parts[2];

                        var targetDate =
                            parts[3];

                        var targetHours =
                            parseFloat(parts[4]);

                        var completedHours =
                            parseFloat(parts[5]);

                        var status =
                            parts[6];

                        var percentage =
                            parseFloat(parts[7]);


                        var row =
                            table.insertRow();


                        row.innerHTML =

                            "<td>" + title + "</td>" +

                            "<td>" + type + "</td>" +

                            "<td>" + targetDate + "</td>" +

                            "<td>" +
                            completedHours +
                            " / " +
                            targetHours +
                            " hrs</td>" +

                            "<td>" +

                            "<div class='progress-box'>" +

                            "<div class='progress-bar' " +

                            "style='width:" +
                            percentage +
                            "%;'></div>" +

                            "</div>" +

                            Math.round(percentage) +
                            "%" +

                            "</td>" +

                            "<td>" +
                            status +
                            "</td>" +

                            "<td>" +

                            "<button onclick=\"updateGoal(" +
                            goalID +
                            "," +
                            targetHours +
                            ")\">Update</button>" +

                            "<button onclick=\"deleteGoal(" +
                            goalID +
                            ")\">Delete</button>" +

                            "</td>";

                    });

                })

                .catch(error => {

                    console.log(error);

                });
        }



        function updateGoal(
            goalID,
            targetHours) {

            var completedHours =
                prompt(
                    "Enter completed study hours:"
                );


            if (completedHours === null) {
                return;
            }


            completedHours =
                parseFloat(completedHours);


            if (
                isNaN(completedHours) ||
                completedHours < 0 ||
                completedHours > targetHours
            ) {

                alert(
                    "Please enter a valid number between 0 and " +
                    targetHours
                );

                return;
            }


            fetch("/api/goals/update", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    goalID: String(goalID),

                    completedHours: String(completedHours)

                })

            })

                .then(response => response.text())

                .then(result => {

                    alert(result);

                    loadGoals();

                })

                .catch(error => {

                    console.log(error);

                    alert("Update failed.");

                });
        }
function deleteGoal(goalID) {

    if (!confirm("Are you sure you want to delete this goal?")) {
        return;
    }

    fetch("/api/goals/delete", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            goalID: String(goalID)

        })

    })

    .then(response => response.text())

    .then(result => {

        if (result === "Goal deleted successfully!") {

            loadGoals();

        } else {

            alert(result);

        }

    })

    .catch(error => {

        console.log(error);

        alert("Delete failed.");

    });
}

        // Load goals when page opens
        loadGoals();

    </script>
</body>

</html>
