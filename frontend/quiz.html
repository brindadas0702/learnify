<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify - Quiz Center</title>
    <link rel="stylesheet" href="style/quiz-style.css">
</head>
<body>
    <nav>
        <h2>Learnify</h2>
        <div>
            <a href="index.html">Dashboard</a>
            <a href="notebook.html">Notebook</a>
            <a href="quiz.html"  style="text-decoration: underline;">Quiz</a>
            <a href="flashcards.html">Flashcards</a>
            <a href="goals.html">Goal Tracker</a>
        </div>
    </nav>

    <main class="container">
        <section class="page-heading">
            <h1>Quiz Center</h1>
            <p>Create quizzes, add questions, and test your knowledge.</p>
        </section>

        <section class="panel">
            <h2>Available Quizzes</h2>
            <p>Attempt any quiz, or add questions to a quiz you created.</p>
            <div id="quizList" class="quiz-list"><p>Loading quizzes...</p></div>
            <p id="quizListMessage" class="message" role="status"></p>
        </section>

        <section class="panel">
            <h2>Create a Quiz</h2>
            <form id="createQuizForm">
                <label for="quizTitle">Quiz Title</label>
                <input type="text" id="quizTitle" maxlength="200"
                       placeholder="Example: Java Programming" required>
                <label for="quizDescription">Description</label>
                <textarea id="quizDescription" maxlength="500"
                          placeholder="Enter a short description"></textarea>
                <button type="submit">Create Quiz</button>
            </form>
            <p id="createMessage" class="message" role="status"></p>
        </section>

        <section class="panel" id="addQuestionPanel" hidden>
            <h2>Add MCQ Questions</h2>
            <p id="selectedQuizMessage"></p>
            <form id="addQuestionForm">
                <label for="questionText">Question</label>
                <textarea id="questionText" placeholder="Enter your question" required></textarea>
                <label for="optionA">Option A</label>
                <input type="text" id="optionA" maxlength="500" required>
                <label for="optionB">Option B</label>
                <input type="text" id="optionB" maxlength="500" required>
                <label for="optionC">Option C</label>
                <input type="text" id="optionC" maxlength="500" required>
                <label for="optionD">Option D</label>
                <input type="text" id="optionD" maxlength="500" required>
                <label for="correctOption">Correct Answer</label>
                <select id="correctOption" required>
                    <option value="">Select the correct option</option>
                    <option value="A">Option A</option>
                    <option value="B">Option B</option>
                    <option value="C">Option C</option>
                    <option value="D">Option D</option>
                </select>
                <button type="submit">Add Question</button>
            </form>
            <p id="questionMessage" class="message" role="status"></p>
        </section>

        <section class="panel" id="attemptPanel" hidden>
            <h2 id="attemptTitle">Attempt Quiz</h2>
            <p id="attemptDescription"></p>
            <form id="attemptQuizForm">
                <div id="questionContainer"></div>
                <button type="submit" id="submitQuizButton">Submit Answers</button>
                <button type="button" id="cancelAttemptButton" class="secondary-button">Cancel</button>
            </form>
            <p id="attemptMessage" class="message" role="status"></p>
            <div id="scoreResult" class="score-result" hidden></div>
        </section>
    </main>

    <script>
        const quizList = document.getElementById("quizList");
        const quizListMessage = document.getElementById("quizListMessage");
        let activeQuizID = null;
        let activeQuizTitle = "";

        async function loadQuizzes() {
            quizList.replaceChildren();
            quizListMessage.textContent = "Loading quizzes...";

            try {
                const response = await fetch("/api/quizzes/list");

                if (response.status === 401) {
                    quizListMessage.textContent = "Please log in to view quizzes.";
                    return;
                }
                if (!response.ok) throw new Error("Unable to load quizzes.");

                const quizzes = await response.json();
                quizListMessage.textContent = "";

                if (!quizzes.length) {
                    quizList.textContent = "No quizzes available yet. Create your first quiz below!";
                    return;
                }

                quizzes.forEach(quiz => {
                    const card = document.createElement("article");
                    card.className = "quiz-card";

                    const title = document.createElement("h3");
                    title.textContent = quiz.title;

                    const description = document.createElement("p");
                    description.textContent = quiz.description || "No description provided.";

                    const attemptButton = document.createElement("button");
                    attemptButton.textContent = "Attempt Quiz";
                    attemptButton.addEventListener("click", () => startAttempt(quiz));

                    card.append(title, description, attemptButton);

                    if (quiz.isOwner) {
                        const addButton = document.createElement("button");
                        addButton.textContent = "Add Questions";
                        addButton.className = "secondary-button";
                        addButton.addEventListener("click", () => openAddQuestionPanel(quiz));
                        card.appendChild(addButton);
                    }

                    quizList.appendChild(card);
                });
            } catch (error) {
                quizListMessage.textContent = "Could not load quizzes. Check your server.";
                console.error(error);
            }
        }

        function openAddQuestionPanel(quiz) {
            const panel = document.getElementById("addQuestionPanel");
            panel.hidden = false;
            panel.dataset.quizId = quiz.quizID;
            document.getElementById("selectedQuizMessage").textContent = "Selected quiz: " + quiz.title;
            document.getElementById("questionMessage").textContent = "";
            panel.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        document.getElementById("createQuizForm").addEventListener("submit", async event => {
            event.preventDefault();
            const title = document.getElementById("quizTitle").value.trim();
            const description = document.getElementById("quizDescription").value.trim();
            const message = document.getElementById("createMessage");

            if (!title) {
                message.textContent = "Please enter a quiz title.";
                return;
            }

            message.textContent = "Creating quiz...";
            try {
                const response = await fetch("/api/quizzes/create", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, description })
                });
                const result = await response.text();

                if (response.status === 401) {
                    message.textContent = "Please log in first.";
                    return;
                }

                message.textContent = result;
                if (response.ok && result.startsWith("Quiz created successfully.")) {
                    document.getElementById("createQuizForm").reset();
                    await loadQuizzes();
                }
            } catch (error) {
                message.textContent = "Could not create the quiz.";
                console.error(error);
            }
        });

        document.getElementById("addQuestionForm").addEventListener("submit", async event => {
            event.preventDefault();
            const panel = document.getElementById("addQuestionPanel");
            const quizID = panel.dataset.quizId;
            const message = document.getElementById("questionMessage");

            if (!quizID) {
                message.textContent = "Please select one of your quizzes first.";
                return;
            }

            const questionData = {
                quizID,
                question: document.getElementById("questionText").value.trim(),
                optionA: document.getElementById("optionA").value.trim(),
                optionB: document.getElementById("optionB").value.trim(),
                optionC: document.getElementById("optionC").value.trim(),
                optionD: document.getElementById("optionD").value.trim(),
                correctOption: document.getElementById("correctOption").value
            };

            if (!questionData.question || !questionData.optionA || !questionData.optionB ||
                !questionData.optionC || !questionData.optionD || !questionData.correctOption) {
                message.textContent = "Please fill in the question and all four options.";
                return;
            }

            message.textContent = "Saving question...";
            try {
                const response = await fetch("/api/quizzes/questions/add", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(questionData)
                });
                const result = await response.text();

                if (response.status === 401) {
                    message.textContent = "Please log in first.";
                    return;
                }
                if (response.status === 403) {
                    message.textContent = "You can only add questions to your own quizzes.";
                    return;
                }

                message.textContent = result;
                if (response.ok && result === "Question added successfully.") {
                    document.getElementById("addQuestionForm").reset();
                }
            } catch (error) {
                message.textContent = "Could not save the question.";
                console.error(error);
            }
        });

        async function startAttempt(quiz) {
            const panel = document.getElementById("attemptPanel");
            const container = document.getElementById("questionContainer");
            const message = document.getElementById("attemptMessage");
            const result = document.getElementById("scoreResult");

            activeQuizID = quiz.quizID;
            activeQuizTitle = quiz.title;
            container.replaceChildren();
            message.textContent = "Loading questions...";
            result.hidden = true;
            result.textContent = "";
            panel.hidden = false;
            document.getElementById("attemptTitle").textContent = "Attempt: " + quiz.title;
            document.getElementById("attemptDescription").textContent = quiz.description || "";
            document.getElementById("submitQuizButton").hidden = false;

            try {
                const response = await fetch("/api/quizzes/questions?id=" + encodeURIComponent(quiz.quizID));
                if (response.status === 401) {
                    message.textContent = "Please log in first.";
                    return;
                }
                if (!response.ok) throw new Error("Could not load questions.");

                const questions = await response.json();
                if (!questions.length) {
                    message.textContent = "This quiz has no questions yet.";
                    document.getElementById("submitQuizButton").hidden = true;
                    panel.scrollIntoView({ behavior: "smooth", block: "start" });
                    return;
                }

                questions.forEach((question, index) => {
                    const block = document.createElement("fieldset");
                    block.className = "question-block";

                    const legend = document.createElement("legend");
                    legend.textContent = (index + 1) + ". " + question.question;
                    block.appendChild(legend);

                    ["A", "B", "C", "D"].forEach(letter => {
                        const label = document.createElement("label");
                        label.className = "answer-option";

                        const radio = document.createElement("input");
                        radio.type = "radio";
                        radio.name = "question-" + question.questionID;
                        radio.value = letter;

                        const text = document.createElement("span");
                        text.textContent = letter + ". " + question["option" + letter];

                        label.append(radio, text);
                        block.appendChild(label);
                    });

                    container.appendChild(block);
                });

                message.textContent = "Choose one answer for each question, then submit.";
                panel.scrollIntoView({ behavior: "smooth", block: "start" });
            } catch (error) {
                message.textContent = "Could not load quiz questions. Check your server.";
                console.error(error);
            }
        }

        document.getElementById("attemptQuizForm").addEventListener("submit", async event => {
            event.preventDefault();
            if (!activeQuizID) return;

            const container = document.getElementById("questionContainer");
            const questionBlocks = container.querySelectorAll(".question-block");
            const answers = [];

            questionBlocks.forEach(block => {
                const selected = block.querySelector('input[type="radio"]:checked');
                if (selected) {
                    const questionID = selected.name.substring("question-".length);
                    answers.push(questionID + ":" + selected.value);
                }
            });

            const message = document.getElementById("attemptMessage");
            const scoreResult = document.getElementById("scoreResult");

            if (answers.length === 0) {
                message.textContent = "Please select at least one answer before submitting.";
                return;
            }

            message.textContent = "Checking your answers...";
            scoreResult.hidden = true;

            try {
                const response = await fetch("/api/quizzes/submit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        quizID: String(activeQuizID),
                        answers: answers.join(",")
                    })
                });
                const result = await response.text();

                if (response.status === 401) {
                    message.textContent = "Please log in first.";
                    return;
                }
                if (!response.ok) {
                    message.textContent = result || "Could not check your answers.";
                    return;
                }

                const match = result.match(/Score:\s*(\d+)\s*\/\s*(\d+)/);
                if (match) {
                    scoreResult.textContent = "Your score: " + match[1] + " / " + match[2];
                    scoreResult.hidden = false;
                    message.textContent = "Quiz completed! Your score is shown below.";
                    document.getElementById("submitQuizButton").hidden = true;
                    container.querySelectorAll("input").forEach(input => input.disabled = true);
                } else {
                    message.textContent = result;
                }
            } catch (error) {
                message.textContent = "Could not submit your answers.";
                console.error(error);
            }
        });

        document.getElementById("cancelAttemptButton").addEventListener("click", () => {
            document.getElementById("attemptPanel").hidden = true;
            activeQuizID = null;
        });

        loadQuizzes();
    </script>
</body>
</html>
